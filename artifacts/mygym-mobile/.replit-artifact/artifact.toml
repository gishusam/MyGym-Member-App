kind = "mobile"
previewPath = "/mygym-mobile/"
title = "MyGym Member App"
description = "A native fitness membership companion for MyGym members to see membership status, weekly activity, and today’s workout, with room to grow into tracking and check-in."
version = "1.0.0"
id = "artifacts/mygym-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mygym-mobile/" ]
localPort = 23911

[services.development]
run = "pnpm --filter @workspace/mygym-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mygym-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mygym-mobile", "run", "serve" ]

[services.env]
PORT = "23911"
BASE_PATH = "/mygym-mobile/"
